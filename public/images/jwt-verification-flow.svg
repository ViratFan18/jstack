<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
  <title id="title">JWT validation flow</title>
  <desc id="description">A token is checked cryptographically, its required claims are validated, and application authorization is decided separately.</desc>
  <rect width="960" height="360" rx="24" fill="#111820"/>
  <path d="M56 48h848" stroke="#26343D" stroke-width="2"/>
  <text x="56" y="88" fill="#A8B8B0" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">A TRUSTED REQUEST FLOW</text>
  <g font-family="Arial,sans-serif">
    <rect x="48" y="132" width="190" height="132" rx="16" fill="#172C23" stroke="#39C98A" stroke-width="2"/>
    <text x="143" y="176" text-anchor="middle" fill="#39C98A" font-size="18" font-weight="700">1 · TOKEN</text>
    <text x="143" y="208" text-anchor="middle" fill="#F1F5F3" font-size="16">Untrusted input</text>
    <text x="143" y="234" text-anchor="middle" fill="#A8B8B0" font-size="13">Parse expected format</text>
    <path d="M250 198h54m-13-12 13 12-13 12" fill="none" stroke="#39C98A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="318" y="132" width="190" height="132" rx="16" fill="#151E26" stroke="#329BFA" stroke-width="2"/>
    <text x="413" y="176" text-anchor="middle" fill="#329BFA" font-size="18" font-weight="700">2 · VERIFY</text>
    <text x="413" y="208" text-anchor="middle" fill="#F1F5F3" font-size="16">Trusted key + policy</text>
    <text x="413" y="234" text-anchor="middle" fill="#A8B8B0" font-size="13">Signature / algorithm</text>
    <path d="M520 198h54m-13-12 13 12-13 12" fill="none" stroke="#39C98A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="588" y="132" width="168" height="132" rx="16" fill="#151E26" stroke="#329BFA" stroke-width="2"/>
    <text x="672" y="176" text-anchor="middle" fill="#329BFA" font-size="18" font-weight="700">3 · CLAIMS</text>
    <text x="672" y="208" text-anchor="middle" fill="#F1F5F3" font-size="16">iss · aud · exp</text>
    <text x="672" y="234" text-anchor="middle" fill="#A8B8B0" font-size="13">Application requirements</text>
    <path d="M768 198h38m-13-12 13 12-13 12" fill="none" stroke="#39C98A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="820" y="132" width="96" height="132" rx="16" fill="#172C23" stroke="#39C98A" stroke-width="2"/>
    <text x="868" y="183" text-anchor="middle" fill="#39C98A" font-size="16" font-weight="700">4 · AUTH</text>
    <text x="868" y="216" text-anchor="middle" fill="#F1F5F3" font-size="13">Rules</text>
  </g>
  <text x="480" y="316" text-anchor="middle" fill="#A8B8B0" font-family="Arial,sans-serif" font-size="15">Decoding alone is not verification. Verification alone is not authorization.</text>
</svg>
